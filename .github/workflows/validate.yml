name: Validate dataset and application
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate_windows_paths.js
      - run: node scripts/audit_published_dataset.js
      - run: npm test
      - run: npm run build
